<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campanha Microlins</title>

  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .video-container {
      position: relative;
      width: 90%;
      max-width: 900px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255,255,255,0.2);
    }

    video {
      width: 100%;
      display: block;
      border-radius: 20px;
    }

    .emoji-top,
    .emoji-bottom {
      position: absolute;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 15px;
      font-size: 32px;
      z-index: 2;
      animation: pulse 1.5s infinite;
    }

    .emoji-top {
      top: 10px;
    }

    .emoji-bottom {
      bottom: 10px;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="video-container">

    <!-- Emojis topo -->
    <div class="emoji-top">
      🎓 💙 🅼 🚀 📚
    </div>

    <!-- Vídeo -->
    <video autoplay muted loop playsinline>
      <source src="SEU-VIDEO.mp4" type="video/mp4">
      Seu navegador não suporta vídeo.
    </video>

    <!-- Emojis embaixo -->
    <div class="emoji-bottom">
      ✨ 🅼 🔥 🎯 💼
    </div>

  </div>

</body>
</html>
