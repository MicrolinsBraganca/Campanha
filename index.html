<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Campanha Microlins</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:Arial, sans-serif;
}

.video-container{
  position:relative;
  width:75%;
  max-width:700px;
  border-radius:25px;
  overflow:hidden;
  box-shadow:
    0 0 20px rgba(0,153,255,.4),
    0 0 60px rgba(0,153,255,.2);
}

/* vídeo */
video{
  width:100%;
  height:auto;
  display:block;
  background:#000;
  object-fit:contain;
}

/* overlay */
.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(0,0,0,.45),
    rgba(0,0,0,.10)
  );
  z-index:1;
  pointer-events:none;
}

/* emojis topo e baixo */
.emoji-top,
.emoji-bottom{
  position:absolute;
  width:100%;
  display:flex;
  justify-content:center;
  gap:18px;
  z-index:3;
  font-size:34px;
}

.emoji-top{ top:12px; }
.emoji-bottom{ bottom:12px; }

.emoji{
  animation:float 4s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-10px) scale(1.1);}
}

/* floating emojis */
.floating-emoji{
  position:absolute;
  font-size:30px;
  z-index:0;
  opacity:.7;
  animation:drift linear infinite;
}

.e1{left:5%; animation-duration:12s;}
.e2{left:20%; animation-duration:15s;}
.e3{left:40%; animation-duration:18s;}
.e4{left:65%; animation-duration:14s;}
.e5{left:85%; animation-duration:16s;}

@keyframes drift{
  from{transform:translateY(100vh);}
  to{transform:translateY(-120vh);}
}

/* responsivo */
@media(max-width:600px){
  .video-container{width:92%;}
  .emoji-top,.emoji-bottom{font-size:24px;}
  .floating-emoji{font-size:22px;}
}
</style>
</head>

<body>

<!-- emojis flutuando -->
<div class="floating-emoji e1">🎓</div>
<div class="floating-emoji e2">💙</div>
<div class="floating-emoji e3">🚀</div>
<div class="floating-emoji e4">📚</div>
<div class="floating-emoji e5">✨</div>

<div class="video-container">

  <div class="overlay"></div>

  <div class="emoji-top">
    <span class="emoji">🎓</span>
    <span class="emoji">💙</span>
    <span class="emoji">🅼</span>
    <span class="emoji">🚀</span>
    <span class="emoji">📚</span>
  </div>

  <!-- VÍDEO -->
  <video id="video" autoplay loop playsinline controls preload="auto">
    <source src="./video.mp4" type="video/mp4">
  </video>

  <div class="emoji-bottom">
    <span class="emoji">✨</span>
    <span class="emoji">🅼</span>
    <span class="emoji">🔥</span>
    <span class="emoji">🎯</span>
    <span class="emoji">💼</span>
  </div>

</div>

<script>
const video = document.getElementById('video');

video.volume = 1;

function tryPlay(){
  video.play().catch(() => {
    console.log("Autoplay bloqueado — aguardando interação");
  });
}

document.addEventListener("click", tryPlay);
document.addEventListener("touchstart", tryPlay);
window.addEventListener("load", tryPlay);
</script>

</body>
</html>
